name: Exportar despachos

on:
  schedule:
    # Cada 30 minutos. La hora es UTC; Perú es UTC-5.
    - cron: "*/30 * * * *"
  workflow_dispatch:  # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar el script
        env:
          DISPATCHTRACK_API_KEY: ${{ secrets.DISPATCHTRACK_API_KEY }}
        run: python exportar_despachos.py

      - name: Guardar el Excel en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add reportes/
          git commit -m "Actualizar despachos $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "Sin cambios"
          git push
